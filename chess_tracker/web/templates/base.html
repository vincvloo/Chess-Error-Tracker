<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chess Error Tracker{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --border: #e2e2e6; --text: #1c1c1f;
  --muted: #6b6b74; --accent: #3f6fd6; --accent-soft: #e8edfb;
  --danger: #c1507a; --danger-soft: #fbe8ee; --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181c; --panel: #1f2024; --border: #313238; --text: #ececef;
    --muted: #9a9aa2; --accent: #7da2ff; --accent-soft: #263252;
    --danger: #e08aa8; --danger-soft: #3a2530; --on-accent: #0e1526;
  }
}
* { box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible { outline-offset: 0; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { padding: 20px 24px 8px; max-width: 808px; margin: 0 auto; }
.mainnav { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 10px 0 0; }
.mainnav a { padding: 5px 11px; border-radius: 999px; font-size: 13px; color: var(--muted);
  text-decoration: none; border: 1px solid transparent; }
.mainnav a:hover { color: var(--accent); border-color: var(--border); }
.mainnav a[aria-current="page"] { color: var(--text); background: var(--panel);
  border-color: var(--border); font-weight: 600; }
#stickyProgress { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
  border-top: 1px solid var(--border); padding: 8px 16px; display: none;
  align-items: center; gap: 10px; font-size: 12.5px; text-decoration: none; color: var(--text); }
#stickyProgress.show { display: flex; }
#stickyProgress .track { flex: 1; max-width: 320px; height: 6px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
#stickyProgress .fill { display: block; background: var(--accent); height: 100%; width: 0%;
  transition: width .3s; }
#stickyProgress .pct { color: var(--muted); min-width: 3em; text-align: right; }
h1 { font-size: 20px; margin: 0 0 2px; }
h1 a { color: inherit; text-decoration: none; }
main { padding: 16px 24px 64px; max-width: 808px; margin: 0 auto; }
.scrollx { overflow-x: auto; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
thead th { color: var(--muted); font-weight: 600; }
label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
input, select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); width: 100%; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 120px; }
/* One button system, applied consistently whether the control is a real
   <button> (a JS/form action) or an <a> styled to match (a navigation
   action of equal weight) -- peer actions should never look different
   just because of which HTML element happened to implement them. */
button, .btn, .btn-secondary { font: inherit; padding: 9px 18px; border-radius: 7px;
  border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 13.5px;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  line-height: 1.2; white-space: nowrap; }
button, .btn { background: var(--accent); color: var(--on-accent); }
button:hover, .btn:hover { opacity: 0.9; }
button:disabled, .btn:disabled { opacity: 0.5; cursor: default; }
button { margin-top: 14px; }
.btn-secondary { background: var(--panel); border-color: var(--border); color: var(--text); }
.btn-secondary:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.error { background: var(--danger-soft); color: var(--danger); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }
a.button-link { display: inline-block; margin-top: 4px; font-size: 12.5px; color: var(--accent); }
.muted { color: var(--muted); }
.headerrow { display: flex; justify-content: space-between; align-items: baseline; }
.navlink { font-size: 12.5px; color: var(--muted); text-decoration: none; }
.navlink:hover { color: var(--accent); }
.backnav { margin-bottom: 8px; font-size: 12.5px; }
.backnav a { color: var(--muted); text-decoration: none; }
.backnav a:hover { color: var(--accent); }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
@media (max-width: 420px) { .actions { grid-template-columns: 1fr; } }
.actioncard-wide { grid-column: 1 / -1; }
.actioncard { display: block; width: 100%; margin: 0; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center;
  text-decoration: none; color: var(--text); font-weight: 600; font-size: 13.5px; }
.actioncard:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.actioncard .sub { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px;
  margin-top: 3px; }
.sectiontitle { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); margin: 14px 0 6px; }
@media (max-width: 480px) {
  header { padding: 14px 12px 6px; }
  main { padding: 12px 10px 72px; }
  .panel { padding: 14px 12px; }
  .mainnav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -12px; }
  .mainnav a { white-space: nowrap; }
}
@media (max-width: 480px), (pointer: coarse) {
  button, .btn, .btn-secondary { min-height: 44px; }
  .mainnav a { padding: 9px 12px; }
}
/* Badge-earned toast, shared by every page that can award one. */
.badgetoast { display: none; margin: 10px 0; padding: 10px 14px; border-radius: 8px;
  background: var(--accent-soft); border: 1px solid var(--accent); font-size: 13px; }
.badgetoast.show { display: block; animation: badgepop .35s ease-out; }
.badgetoast b { display: block; }
@keyframes badgepop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .badgetoast.show { animation: none; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="headerrow">
    <h1><a href="/">Chess Error Tracker</a></h1>
    <a class="navlink" href="/settings">Settings</a>
  </div>
  {% if settings and settings.primary_user %}
  {% set path = request.url.path %}
  <nav class="mainnav" aria-label="Main">
    <a href="/"{% if path == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="/practice"{% if path.startswith('/practice') %} aria-current="page"{% endif %}>Practice</a>
    <a href="/puzzles"{% if path.startswith('/puzzles') %} aria-current="page"{% endif %}>Puzzles</a>
    <a href="/play"{% if path.startswith('/play') %} aria-current="page"{% endif %}>Play</a>
    <a href="/achievements"{% if path.startswith('/achievements') %} aria-current="page"{% endif %}>Achievements</a>
    <a href="/leaderboard"{% if path.startswith('/leaderboard') %} aria-current="page"{% endif %}>Leaderboard</a>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<a id="stickyProgress" href="/jobs/">
  <span id="stickyProgressLabel">Updating&hellip;</span>
  <span class="track"><span class="fill" id="stickyProgressFill"></span></span>
  <span class="pct" id="stickyProgressPct"></span>
</a>
<script>
// Shows "badge earned" lines in a .badgetoast element; no-op with nothing to show.
function showBadgeToast(badges, el) {
  if (!badges || !badges.length || !el) return;
  el.textContent = "";
  badges.forEach(function (b) {
    var line = document.createElement("div");
    var name = document.createElement("b");
    name.textContent = "Badge earned: " + b.label;
    line.appendChild(name);
    line.appendChild(document.createTextNode(b.description));
    el.appendChild(line);
  });
  el.classList.add("show");
}
</script>
<script>
(function () {
  var bar = document.getElementById("stickyProgress");
  var label = document.getElementById("stickyProgressLabel");
  var fill = document.getElementById("stickyProgressFill");
  var pct = document.getElementById("stickyProgressPct");
  var onProgressPage = /^\/jobs\/[^/]+$/.test(location.pathname);
  var currentJobId = null;

  function showJob(jobId) {
    currentJobId = jobId;
    bar.href = "/jobs/" + jobId;
    bar.classList.add("show");
  }

  function hideJob() {
    currentJobId = null;
    bar.classList.remove("show");
  }

  function shortDuration(totalMinutes) {
    if (totalMinutes < 60) return Math.max(1, totalMinutes) + "m";
    var hours = totalMinutes / 60;
    if (hours < 24) return (hours >= 10 ? Math.round(hours) : Math.round(hours * 10) / 10) + "h";
    var days = hours / 24;
    return (days >= 10 ? Math.round(days) : Math.round(days * 10) / 10) + "d";
  }

  // Prefers this run's own measured rate (self-correcting for serial vs.
  // parallel, rather than guessing which applies) once it has analysed at
  // least one game; a plain per-game guess before that.
  function estimateRemaining(s) {
    var remaining = s.current_total - s.current_index;
    if (remaining <= 0) return null;
    var startedMs = s.started_at ? Date.parse(s.started_at) : NaN;
    var elapsedSec = isNaN(startedMs) ? 0 : (Date.now() - startedMs) / 1000;
    var seconds = (s.current_index > 0 && elapsedSec > 0)
      ? remaining / (s.current_index / elapsedSec)
      : remaining * 30;
    return shortDuration(Math.round(seconds / 60));
  }

  async function pollJob() {
    if (!currentJobId) return;
    let s;
    try {
      s = await (await fetch("/api/jobs/" + currentJobId)).json();
    } catch (e) {
      return;
    }
    if (s.state === "running" || s.state === "queued") {
      var p = s.current_total ? Math.round(s.current_index / s.current_total * 100) : 0;
      fill.style.width = p + "%";
      pct.textContent = p + "%";
      if (s.current_user) {
        var eta = estimateRemaining(s);
        label.textContent = "Updating " + s.current_user + (eta ? " — ~" + eta + " left" : "");
      } else {
        label.textContent = "Starting…";
      }
    } else {
      hideJob();
    }
  }

  async function pollActive() {
    if (currentJobId) return;
    try {
      var r = await (await fetch("/api/jobs/active")).json();
      if (r.job_id) showJob(r.job_id);
    } catch (e) {
      // ignore -- try again next tick
    }
  }

  // The dedicated progress page has its own, more detailed bar -- the
  // sticky one only needs to appear everywhere else.
  if (!onProgressPage) {
    setInterval(function () { currentJobId ? pollJob() : pollActive(); }, 1500);
    pollActive();
  }
})();
</script>
</body>
</html>
