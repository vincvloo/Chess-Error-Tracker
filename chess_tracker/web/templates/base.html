<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chess Error Tracker{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f8; --panel: #ffffff; --border: #e2e2e6; --text: #1c1c1f;
  --muted: #6b6b74; --accent: #3f6fd6; --accent-soft: #e8edfb;
  --danger: #c1507a; --danger-soft: #fbe8ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181c; --panel: #1f2024; --border: #313238; --text: #ececef;
    --muted: #9a9aa2; --accent: #7da2ff; --accent-soft: #263252;
    --danger: #e08aa8; --danger-soft: #3a2530;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { padding: 20px 24px 8px; }
h1 { font-size: 20px; margin: 0 0 2px; }
h1 a { color: inherit; text-decoration: none; }
main { padding: 16px 24px 40px; max-width: 760px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
thead th { color: var(--muted); font-weight: 600; }
label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
input, select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); width: 100%; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 120px; }
/* One button system, applied consistently whether the control is a real
   <button> (a JS/form action) or an <a> styled to match (a navigation
   action of equal weight) -- peer actions should never look different
   just because of which HTML element happened to implement them. */
button, .btn, .btn-secondary { font: inherit; padding: 9px 18px; border-radius: 7px;
  border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 13.5px;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  line-height: 1.2; white-space: nowrap; }
button, .btn { background: var(--accent); color: #fff; }
button:hover, .btn:hover { opacity: 0.9; }
button:disabled, .btn:disabled { opacity: 0.5; cursor: default; }
button { margin-top: 14px; }
.btn-secondary { background: var(--panel); border-color: var(--border); color: var(--text); }
.btn-secondary:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.error { background: var(--danger-soft); color: var(--danger); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; }
a.button-link { display: inline-block; margin-top: 4px; font-size: 12.5px; color: var(--accent); }
.muted { color: var(--muted); }
.headerrow { display: flex; justify-content: space-between; align-items: baseline; }
.navlink { font-size: 12.5px; color: var(--muted); text-decoration: none; }
.navlink:hover { color: var(--accent); }
.backnav { margin-bottom: 8px; font-size: 12.5px; }
.backnav a { color: var(--muted); text-decoration: none; }
.backnav a:hover { color: var(--accent); }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
@media (max-width: 420px) { .actions { grid-template-columns: 1fr; } }
.actioncard-wide { grid-column: 1 / -1; }
.actioncard { display: block; width: 100%; margin: 0; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center;
  text-decoration: none; color: var(--text); font-weight: 600; font-size: 13.5px; }
.actioncard:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.actioncard .sub { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px;
  margin-top: 3px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="headerrow">
  <h1><a href="/">Chess Error Tracker</a></h1>
  <a class="navlink" href="/settings">Settings</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
