[project]
name = "chess-error-tracker"
version = "0.1.0"
description = "Finds the mistakes you keep making, not the ones you made yesterday."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "chess>=1.11,<2",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-tracker = "chess_error_tracker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["chess_error_tracker"]
