[project]
name = "chess-error-tracker"
version = "0.1.0"
description = "Finds the mistakes you keep making, not the ones you made yesterday."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "chess>=1.11,<2",
    "requests>=2.34,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1"]

[project.scripts]
chess-tracker = "chess_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chess_tracker", "chess_tracker.web"]

[tool.setuptools.package-data]
chess_tracker = ["templates/*.html"]
"chess_tracker.web" = ["templates/*.html"]
