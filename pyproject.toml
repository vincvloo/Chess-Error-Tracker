[project]
name = "chess-mistake-coach"
version = "0.1.0"
description = "Find the mistakes you keep making in chess and train them away: analyse your games with Stockfish, then practise, solve puzzles and play a coached game against a bot."
keywords = ["chess", "stockfish", "chess-analysis", "chess-improvement", "chess.com", "lichess-puzzles"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "chess>=1.11,<2",
    "requests>=2.34,<3",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1"]

[project.scripts]
chess-mistake-coach = "chess_mistake_coach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chess_mistake_coach", "chess_mistake_coach.web"]

[tool.setuptools.package-data]
chess_mistake_coach = ["templates/*.html"]
"chess_mistake_coach.web" = ["templates/*.html"]
